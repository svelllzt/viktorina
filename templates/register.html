{% extends "base.html" %}
{% block title %}Регистрация — QuizLab{% endblock %}
{% block page_id %}auth{% endblock %}
{% block content %}
<div class="auth-layout fade-in">
  <div class="card card-glass auth-card">
    <h1 class="h1-tight">Регистрация</h1>
    <p class="muted">Создайте аккаунт автора</p>
    <form method="post" action="/register" class="form-stack" data-validate="register">
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" name="email" class="input {% if errors.email %}input-invalid{% endif %}" required value="{{ email or '' }}">
        {% if errors.email %}<span class="field-error show">{{ errors.email }}</span>{% endif %}
      </label>
      <label class="field">
        <span class="field-label">Пароль</span>
        <input type="password" name="password" class="input {% if errors.password %}input-invalid{% endif %}" required minlength="8">
        {% if errors.password %}<span class="field-error show">{{ errors.password }}</span>{% endif %}
      </label>
      <label class="field">
        <span class="field-label">Повтор пароля</span>
        <input type="password" name="password2" class="input {% if errors.password2 %}input-invalid{% endif %}" required minlength="8">
        {% if errors.password2 %}<span class="field-error show">{{ errors.password2 }}</span>{% endif %}
      </label>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Зарегистрироваться</button>
    </form>
    <p class="auth-switch"><a href="/login">Уже зарегистрированы</a></p>
  </div>
</div>
{% endblock %}
