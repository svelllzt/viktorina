{% extends "base.html" %}
{% block title %}Новый пароль — QuizLab{% endblock %}
{% block page_id %}auth{% endblock %}
{% block content %}
<div class="auth-layout fade-in">
  <div class="card card-glass auth-card layout-stack">
    <h1 class="h1-tight">Новый пароль</h1>
    {% if errors.form %}
    <div class="alert alert-error show">{{ errors.form }}</div>
    {% endif %}
    {% if errors.token %}
    <div class="alert alert-error show">{{ errors.token }}</div>
    {% else %}
    <form method="post" action="/reset-password" class="form-stack" data-validate="register">
      <input type="hidden" name="token" value="{{ token }}">
      <label class="field">
        <span class="field-label">Новый пароль</span>
        <input type="password" name="password" class="input {% if errors.password %}input-invalid{% endif %}" required minlength="8" autocomplete="new-password">
        {% if errors.password %}<span class="field-error show">{{ errors.password }}</span>{% endif %}
      </label>
      <label class="field">
        <span class="field-label">Повтор пароля</span>
        <input type="password" name="password2" class="input {% if errors.password2 %}input-invalid{% endif %}" required minlength="8" autocomplete="new-password">
        {% if errors.password2 %}<span class="field-error show">{{ errors.password2 }}</span>{% endif %}
      </label>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Сохранить</button>
    </form>
    {% endif %}
  </div>
</div>
{% endblock %}
